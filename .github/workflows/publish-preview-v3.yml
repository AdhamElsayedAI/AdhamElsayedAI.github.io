name: Publish portfolio v3 preview

on:
  push:
    branches: [portfolio-v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-v3-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio-v3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build preview
        working-directory: source
        env:
          PREVIEW_BASE_PATH: /preview-v3
          NEXT_PUBLIC_BASE_PATH: /preview-v3
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Write source commit manifest
        working-directory: source
        run: printf '{"sourceCommit":"%s","previewPath":"/preview-v3/"}\n' "$GITHUB_SHA" > out/deployment.json

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Replace preview directory only
        run: |
          rm -rf live/preview-v3
          mkdir -p live/preview-v3
          cp -a source/out/. live/preview-v3/
          touch live/preview-v3/.nojekyll

      - name: Commit preview to main
        working-directory: live
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add preview-v3
          if git diff --cached --quiet; then
            echo "Preview is already current."
          else
            git commit -m "preview: publish portfolio v3 from ${GITHUB_SHA}"
            git push origin main
          fi
