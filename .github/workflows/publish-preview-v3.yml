name: Publish portfolio production

on:
  push:
    branches: [portfolio-v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build production site
        working-directory: source
        env:
          PREVIEW_BASE_PATH: ""
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Write deployment manifest
        working-directory: source
        run: printf '{"sourceCommit":"%s","sitePath":"/","mode":"production"}\n' "$GITHUB_SHA" > out/deployment.json

      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Replace old production and preview copies
        run: |
          find live -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/out/. live/
          touch live/.nojekyll

      - name: Commit production to main
        working-directory: live
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production is already current."
          else
            git commit -m "deploy: publish approved portfolio from ${GITHUB_SHA}"
            git push origin main
          fi
