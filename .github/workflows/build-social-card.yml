name: Build Social Preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-social-card.py'
      - '.github/workflows/build-social-card.yml'
      - 'images/adham-portrait-cutout.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.2.1 numpy==2.2.6
      - name: Generate and verify PNG
        run: |
          python scripts/build-social-card.py
          file og-image.png
      - name: Commit raster social card
        run: |
          if git diff --quiet -- og-image.png && git ls-files --error-unmatch og-image.png >/dev/null 2>&1; then
            echo "Social preview already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          git commit -m "assets: generate PNG social sharing preview"
          git push origin HEAD:main
