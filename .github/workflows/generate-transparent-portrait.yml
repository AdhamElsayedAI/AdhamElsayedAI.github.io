name: Generate transparent portrait

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate pixel-preserving transparent cutout
        run: npm run assets:portrait

      - name: Commit generated cutout
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add public/images/adham-transparent.png public/images/adham-transparent-v2.png
          if git diff --cached --quiet; then
            echo "Cutout unchanged"
          else
            git commit -m "asset: add transparent portrait cutout"
            git push origin portfolio-v3
          fi
