name: Generate transparent portrait

on:
  push:
    branches: [portfolio-v3]
    paths:
      - 'public/images/adham-original.jpg'
      - '.github/workflows/generate-transparent-portrait.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cutout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Remove only border-connected near-white background
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque

          src='public/images/adham-original.jpg'
          dst='public/images/adham-transparent.png'
          im=Image.open(src).convert('RGBA')
          px=im.load(); w,h=im.size
          seen=bytearray(w*h)
          q=deque()

          def near_white(x,y):
              r,g,b,a=px[x,y]
              return r>=238 and g>=238 and b>=238 and max(r,g,b)-min(r,g,b)<=18

          for x in range(w):
              if near_white(x,0): q.append((x,0))
              if near_white(x,h-1): q.append((x,h-1))
          for y in range(h):
              if near_white(0,y): q.append((0,y))
              if near_white(w-1,y): q.append((w-1,y))

          while q:
              x,y=q.popleft(); i=y*w+x
              if seen[i] or not near_white(x,y): continue
              seen[i]=1
              r,g,b,a=px[x,y]
              px[x,y]=(r,g,b,0)
              if x>0:q.append((x-1,y))
              if x+1<w:q.append((x+1,y))
              if y>0:q.append((x,y-1))
              if y+1<h:q.append((x,y+1))

          im.save(dst, optimize=True)
          PY

      - name: Commit generated cutout
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add public/images/adham-transparent.png
          if git diff --cached --quiet; then
            echo "Cutout unchanged"
          else
            git commit -m "asset: add transparent portrait cutout"
            git push origin portfolio-v3
          fi
