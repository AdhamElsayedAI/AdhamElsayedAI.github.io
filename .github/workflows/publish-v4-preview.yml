name: Publish portfolio V4 preview

on:
  push:
    branches: [portfolio-v4-recruiter-grade]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-v4-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build V4 preview
        working-directory: source
        env:
          PREVIEW_BASE_PATH: "/v4-preview"
          NEXT_PUBLIC_BASE_PATH: "/v4-preview"
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Replace V4 preview only
        run: |
          rm -rf live/v4-preview
          mkdir -p live/v4-preview
          cp -a source/out/. live/v4-preview/
          touch live/.nojekyll

      - name: Commit V4 preview
        working-directory: live
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add v4-preview .nojekyll
          if git diff --cached --quiet; then
            echo "V4 preview is already current."
          else
            git commit -m "preview: publish portfolio V4 from ${GITHUB_SHA}"
            git push origin main
          fi
