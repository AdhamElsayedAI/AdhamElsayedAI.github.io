name: Publish refresh preview

on:
  push:
    branches: [portfolio-v3-cv-refresh]
    paths-ignore:
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-v3-cv-refresh-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-v3-cv-refresh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build isolated preview
        env:
          PREVIEW_BASE_PATH: "/AdhamElsayedAI/AdhamElsayedAI.github.io/portfolio-v3-cv-refresh/preview"
          NEXT_PUBLIC_BASE_PATH: "/AdhamElsayedAI/AdhamElsayedAI.github.io/portfolio-v3-cv-refresh/preview"
          NEXT_PUBLIC_BUILD_SHA: $\{{ github.sha }}
        run: npm run build

      - name: Store exported preview on refresh branch
        run: |
          rm -rf preview
          mkdir -p preview
          cp -a out/. preview/
          touch preview/.nojekyll
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "preview: publish portfolio V3 CV refresh"
            git push origin portfolio-v3-cv-refresh
          fi
