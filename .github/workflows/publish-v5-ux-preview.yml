name: Publish portfolio V5 UX preview

on:
  push:
    branches: [portfolio-v5-ux-repair]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-v5-ux-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX repair source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Typecheck
        working-directory: source
        run: npm run typecheck

      - name: Build isolated UX preview
        working-directory: source
        env:
          PREVIEW_BASE_PATH: "/v5-ux-preview"
          NEXT_PUBLIC_BASE_PATH: "/v5-ux-preview"
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Install Playwright Chromium for visual QA
        working-directory: source
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture true viewport QA screenshots
        working-directory: source
        run: |
          rm -rf qa-site qa-screenshots
          mkdir -p qa-site/v5-ux-preview qa-screenshots
          cp -a out/. qa-site/v5-ux-preview/
          python3 -m http.server 4173 --directory qa-site >/tmp/v5-ux-qa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=dark --viewport-size="1440,900" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/" qa-screenshots/home-dark-1440x900.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=light --viewport-size="1440,900" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/" qa-screenshots/home-light-1440x900.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=dark --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#about" qa-screenshots/about-dark-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=light --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#about" qa-screenshots/about-light-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=dark --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#skills" qa-screenshots/stack-dark-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=light --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#skills" qa-screenshots/stack-light-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=dark --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#certifications" qa-screenshots/credentials-dark-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=light --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#certifications" qa-screenshots/credentials-light-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=dark --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#projects" qa-screenshots/projects-dark-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --color-scheme=light --viewport-size="390,844" --wait-for-timeout=1200             "http://127.0.0.1:4173/v5-ux-preview/#projects" qa-screenshots/projects-light-390x844.png

      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Replace UX preview only
        run: |
          rm -rf live/v5-ux-preview
          mkdir -p live/v5-ux-preview
          cp -a source/out/. live/v5-ux-preview/
          mkdir -p live/v5-ux-preview/qa
          cp -a source/qa-screenshots/. live/v5-ux-preview/qa/
          touch live/.nojekyll

      - name: Commit isolated UX preview
        working-directory: live
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add v5-ux-preview .nojekyll
          if git diff --cached --quiet; then
            echo "UX preview is already current."
          else
            git commit -m "preview: publish V5 UX repair from ${GITHUB_SHA}"
            git push origin main
          fi
