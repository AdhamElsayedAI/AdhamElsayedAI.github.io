name: One-time Legacy Branch Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'AdhamElsayedAI/AdhamElsayedAI.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm primary branch and delete only reviewed legacy refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          actual_default="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          test "$actual_default" = "main" || { echo "Default branch changed; aborting." >&2; exit 1; }

          refs=(
            "backup-evidence-ledger-2026-09-29:be4e2bbf6353a53f74d6071ee5bc372746741e94"
            "backup-main-pre-final-2026-10-10:973e81384add5a79f26e4c2773fe92cfcab164a3"
            "portfolio-v3-cv-refresh:dc7e3ec153d134e2519e3dbcad343cf5dc8d0078"
            "portfolio-v3-preserve-ux-fixes:14b71d116ac12536f24ee44984f2fa0d4c751978"
            "portfolio-v3:4830c52941367796cdc2a55376f33351d7a1cce3"
            "portfolio-v4-recruiter-grade:4813fd1c916153db7e7dd234b42425e1b02152fd"
            "portfolio-v5-cinematic:5c2e15696eb8ed00842f088b82e1da2bcaeb99fc"
            "portfolio-v5-ux-repair:8100dd9fff38cacfdd22e5db77fee68fef062068"
            "preview-v3-animation-approved:8ccd2c0d2b9a19d420db7348602906659c132946"
          )
          for entry in "${refs[@]}"; do
            branch="${entry%%:*}"
            expected="${entry##*:}"
            test "$branch" != "main"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [ "$current" != "$expected" ]; then
              echo "Branch $branch changed ($current); aborting rather than deleting new work." >&2
              exit 1
            fi
          done
          for entry in "${refs[@]}"; do
            branch="${entry%%:*}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted reviewed legacy branch: $branch"
          done
