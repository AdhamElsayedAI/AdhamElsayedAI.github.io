name: Finalize Hero Portrait

on:
  push:
    paths:
      - '.github/workflows/finalize-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use professional hero portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://avatars.githubusercontent.com/u/145601881?v=4', 'assets/adham-hero.webp')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "Adham Elsayed"
          git config user.email "145601881+AdhamElsayedAI@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: use black-suit portrait in portfolio hero"
          git push origin main
