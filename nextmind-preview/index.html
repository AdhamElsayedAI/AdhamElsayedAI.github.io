let experienceFrame=null,experienceObserver=null,experienceGL=null,experienceCleanup=null;
function stopExperience(){if(experienceFrame)cancelAnimationFrame(experienceFrame);experienceFrame=null;if(experienceObserver)experienceObserver.disconnect();experienceObserver=null;if(experienceCleanup)experienceCleanup();experienceCleanup=null;experienceGL=null;}
function initExperience(){
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const stage=document.getElementById('experienceStage');
 document.querySelectorAll('.section,.page-hero,.page-section,.service-card,.project-card,.about-profile').forEach((el)=>el.classList.add('reveal-ready'));
 experienceObserver=new IntersectionObserver((entries)=>entries.forEach((e)=>{if(e.isIntersecting){e.target.classList.add('is-visible');experienceObserver?.unobserve(e.target)}}),{rootMargin:'0px 0px -35px 0px',threshold:0.08});
 document.querySelectorAll('.reveal-ready').forEach(el=>experienceObserver.observe(el));
 document.querySelectorAll('.service-card,.project-card,.solution-card').forEach((card)=>card.addEventListener('pointermove',(e)=>{const b=card.getBoundingClientRect();card.style.setProperty('--mouse-x',`${e.clientX-b.left}px`);card.style.setProperty('--mouse-y',`${e.clientY-b.top}px`)},{passive:true}));
 if(!stage)return;
 const emblem=stage.querySelector('.central-emblem');
 let tx=0,ty=0,cx=0,cy=0;
 const move=(e)=>{const b=stage.getBoundingClientRect();tx=(e.clientX-(b.left+b.width/2))/b.width;ty=(e.clientY-(b.top+b.height/2))/b.height;};
 const leave=()=>{tx=0;ty=0};
 stage.addEventListener('pointermove',move,{passive:true});stage.addEventListener('pointerleave',leave);
 experienceCleanup=()=>{stage.removeEventListener('pointermove',move);stage.removeEventListener('pointerleave',leave)};
 const canvas=document.getElementById('neuralCanvas');
 if(!canvas)return;
 const gl=canvas.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:false,powerPreference:'low-power'});
 if(!gl){stage.classList.add('webgl-fallback');runCanvas2D(canvas,stage,reduce,()=>[tx,ty],emblem);return}
 experienceGL=gl;
 const vs=`attribute vec3 aPosition;attribute float aSize;attribute float aTone;uniform float uTime;uniform vec2 uMouse;uniform float uDpr;varying float vTone;varying float vFade;void main(){float t=uTime*0.14+uMouse.x*.45;float c=cos(t),s=sin(t);vec3 p=vec3(aPosition.x*c-aPosition.z*s,aPosition.y,aPosition.x*s+aPosition.z*c);float q=uTime*.09-uMouse.y*.35;float h=cos(q),j=sin(q);p=vec3(p.x,p.y*h-p.z*j,p.y*j+p.z*h);float depth=5.0-p.z;gl_Position=vec4((p.x/depth)*2.6,(p.y/depth)*2.6,p.z*.12,1.0);gl_PointSize=min(8.,aSize*5.0/depth*uDpr);vTone=aTone;vFade=clamp(0.62+p.z*.21,.2,1.);}`;
 const fs=`precision mediump float;uniform float uLight;varying float vTone;varying float vFade;void main(){vec2 p=gl_PointCoord.xy-.5;float r=length(p);float a=1.0-smoothstep(.24,.5,r);vec3 darkColor=mix(vec3(.14,.39,.97),vec3(.35,.84,1.),vTone);vec3 lightColor=mix(vec3(.10,.34,.72),vec3(.10,.63,.91),vTone);gl_FragColor=vec4(mix(darkColor,lightColor,uLight),a*vFade*.85);}`;
 function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
 let program;
 try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));}catch(e){console.warn('3D scene unavailable',e);stage.classList.add('webgl-fallback');return}
 const count=window.innerWidth<640?4200:window.innerWidth<1050?6800:12000;
 let pts=new Float32Array(count*5);const golden=2.399963229728653;
 for(let i=0;i<count;i++){
  const y=1-2*(i+.5)/count,rad=Math.sqrt(Math.max(0,1-y*y)),ang=golden*i;
  let r=1.61+.09*Math.sin(ang*4+y*8)+.055*Math.sin(ang*13),w=(i%7===0?0.22:0.0);
  let ix=i*5;
  pts[ix]=rad*Math.cos(ang)*(r+w);pts[ix+1]=y*(r+w)*.86;pts[ix+2]=rad*Math.sin(ang)*(r+w);
  pts[ix+3]=(i%17===0?3.5:i%5===0?2.5:1.5);pts[ix+4]=(Math.sin(i*2.311)+1)/2;

 let lastW=0,lastH=0,time=0,prev=0,isVisible=true;
 let sceneIO=new IntersectionObserver(es=>{isVisible=es[0]?.isIntersecting??true},{threshold:0.01});sceneIO.observe(stage);
 const cleanupOld=experienceCleanup;experienceCleanup=()=>{cleanupOld?.();sceneIO.disconnect();gl.deleteBuffer(buffer);gl.deleteProgram(program)};
 function frame(now){if(!stage.isConnected)return;
   const bounds=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,1.65);const w=Math.max(1,Math.round(bounds.width*dpr)),h=Math.max(1,Math.round(bounds.height*dpr));
   if(w!==lastW||h!==lastH){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);lastW=w;lastH=h}
   if(isVisible){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);cx+=(tx-cx)*.055;cy+=(ty-cy)*.055;time+=prev?Math.min(now-prev,40)/1000:0;
    gl.uniform1f(uTime,time);gl.uniform2f(uMouse,cx,cy);gl.uniform1f(uDpr,dpr);gl.uniform1f(uLight,document.documentElement.dataset.theme==='light'?1:0);gl.drawArrays(gl.POINTS,0,count);

   }prev=now; if(!reduce)experienceFrame=requestAnimationFrame(frame);
 }
 frame(0);
}

/* True three-dimensional perspective projection drawn with Canvas 2D when WebGL is unavailable. */
function runCanvas2D(canvas,stage,reduce,getMouse,emblem){
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const rings=18,columns=76,pts=[];
 for(let lat=0;lat<rings;lat++){
  let theta=.06+(Math.PI-.12)*lat/(rings-1),row=[];
  for(let j=0;j<columns;j++){
   const phi=2*Math.PI*j/columns;
   const r=1.54+.045*Math.sin(phi*7+theta*9);
   row.push([r*Math.sin(theta)*Math.cos(phi),r*Math.cos(theta)*.94,r*Math.sin(theta)*Math.sin(phi)]);
  }pts.push(row);
 }
 let prev=0,t=0,mouseX=0,mouseY=0;
 function render(now){if(!stage.isConnected)return;
  const dpr=Math.min(devicePixelRatio||1,1.6),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  ctx.clearRect(0,0,w,h);
  const isLight=document.documentElement.dataset.theme==='light';
  const cursor=getMouse();mouseX+=(cursor[0]-mouseX)*.05;mouseY+=(cursor[1]-mouseY)*.05;
  if(!reduce)t+=prev?Math.min(45,now-prev)/1000:0;prev=now;
  const spin=.26+t*.17+mouseX*.9,tilt=.16+Math.sin(t*.12)*.12+mouseY*.5;
  const c=Math.cos(spin),s=Math.sin(spin),u=Math.cos(tilt),v=Math.sin(tilt);
  function project(p){let x=p[0]*c+p[2]*s,z=-p[0]*s+p[2]*c,y=p[1]*u-z*v;z=p[1]*v+z*u;let perspective=4.3/(4.8-z),scale=Math.min(w,h)*.285;return [w*.5+x*scale*perspective,h*.5+y*scale*perspective,z,perspective]}
  const projected=pts.map(r=>r.map(project));
  const far=isLight?'23,104,188':'43,119,255', near=isLight?'25,100,219':'91,200,255';
  ctx.lineWidth=Math.max(.5,dpr*.65);
  // Ribbon latitude lines in depth-sorted semi-transparent layers
  for(let lat=0;lat<rings;lat++){
   let row=projected[lat];
   for(let j=0;j<columns;j++){
    const p=row[j],next=row[(j+1)%columns];
    let a=Math.max(.04,Math.min(.31,.15+(p[2]+next[2])*.052));
    ctx.strokeStyle=`rgba(${(p[2]+next[2])>0?near:far},${a})`;
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(next[0],next[1]);ctx.stroke();
   }
  }
  for(let lat=0;lat<rings-1;lat+=2){
   for(let j=0;j<columns;j+=3){let p=projected[lat][j],n=projected[lat+1][j];
    ctx.strokeStyle=`rgba(${near},${Math.max(.04,Math.min(.14,.06+p[2]*.03))})`;
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(n[0],n[1]);ctx.stroke();
   }
  }
  for(let lat=0;lat<rings;lat++){
   let row=projected[lat];for(let j=0;j<columns;j++){
    const p=row[j],opacity=Math.max(.15,Math.min(.84,.43+p[2]*.17));
    const radius=(j%7===0?1.75:1.05)*dpr*p[3];
    ctx.beginPath();ctx.arc(p[0],p[1],radius,0,Math.PI*2);
    ctx.fillStyle=`rgba(${(j+lat)%4===0?near:far},${opacity})`;ctx.fill();
   }
  }
  if(emblem&&!reduce)emblem.style.transform=`translate(-50%,-50%) perspective(800px) rotateY(${mouseX*18}deg) rotateX(${-mouseY*18}deg)`;
  if(!reduce)experienceFrame=requestAnimationFrame(render);
 }
 render(0);
}

function header(page){return `<header class="site-header" id="siteHeader"><nav class="nav container" aria-label="Main navigation">${brand()}<div class="site-links" id="siteLinks">${navigation.map(([id,label])=>`<a href="#${id}" class="${page===id?'active':''}">${label}</a>`).join('')}</div><div class="nav-actions"><button id="themeSwitch" class="theme-switch" type="button" aria-label="Toggle color theme" title="Toggle Dark/Light">${icon(document.documentElement.dataset.theme==='dark'?'sun':'moon',18)}</button><a href="#contact" class="btn btn-primary btn-small">Let's Talk ${icon('diag',13)}</a><button id="mobileMenu" class="nav-menu" type="button" aria-label="Open navigation" aria-expanded="false">${icon('menu',21)}</button></div></nav></header>`}
function footer(){return `<footer><div class="container"><div class="footer-grid"><div class="footer-brand">${brand()}<p>Real-world AI engineering. Practical AI education. Built with intent.</p></div><div class="footer-col"><strong>Explore</strong><a href="#home">Home</a><a href="#solutions">AI Solutions</a><a href="#academy">Academy</a><a href="#projects">Projects</a></div><div class="footer-col"><strong>Company</strong><a href="#about">About</a><a href="#contact">Contact</a><a href="https://nextmindai.net" target="_blank" rel="noopener">Current website ↗</a></div><div class="footer-col"><strong>Specialties</strong><span>AI Agents & Automation</span><span>Generative AI & RAG</span><span>Computer Vision</span><span>AI Engineering</span></div></div><div class="footer-base"><span>© 2026 NextMind.ai. Design direction: Circuit N Experience.</span><span>Independent visual preview · Not a published replacement</span></div></div></footer>`}
function visualHero(){return `<div class="hero-visual experience" id="experienceStage"><div class="stage-backdrop"></div><canvas id="neuralCanvas" class="neural-canvas" aria-hidden="true"></canvas><div class="orbit-ring ring-one"></div><div class="orbit-ring ring-two"></div><div class="central-emblem"><span class="emblem-glow"></span>${circuitMark('hero-circuit')}</div><div class="float-chip chip-one"><span class="chip-icon">${icon('db',16)}</span><span><small>01 / INPUT</small><b>Knowledge</b></span><i></i></div><div class="float-chip chip-two"><span class="chip-icon">${icon('cpu',16)}</span><span><small>02 / REASON</small><b>Intelligence</b></span><i></i></div><div class="float-chip chip-three"><span class="chip-icon">${icon('workflow',16)}</span><span><small>03 / EXECUTE</small><b>Impact</b></span><i></i></div><div class="stage-annotation top-left">AI SYSTEM / NXT—01</div><div class="stage-annotation bottom-right"><span class="signal-pulse"></span> INTERACTIVE INTELLIGENCE FIELD</div><div class="stage-corner sc1"></div><div class="stage-corner sc2"></div></div>`}
function serviceArt(kind){if(kind==='build')return `<div class="service-art"><div class="art-core">${icon('cpu',30)}</div></div>`;if(kind==='automate')return `<div class="service-art"><div class="art-automation"><div class="mini">${icon('workflow',16)}</div><div class="mini">${icon('check',16)}</div><div class="mini">${icon('bolt',16)}</div></div></div>`;if(kind==='rag')return `<div class="service-art"><div class="art-rag"><span></span><span></span><span>${icon('db',22)}</span></div></div>`;return `<div class="service-art"><div class="art-vision">${icon('scan',28)}</div></div>`}
function intro(kicker,title,desc='',aside=''){return `<div class="section-header"><div><span class="eyebrow">${kicker}</span><h2>${title}</h2></div>${aside?aside:`<p class="section-desc">${desc}</p>`}</div>`}
function projectWindow(project){let type=project.type;let body=type==='doc'?`<div class="proj-line"></div><div class="proj-line small"></div><div class="proj-grid"><div></div><div></div></div>`:type==='sql'?`<div class="sql-code">SELECT customer_name,<br> SUM(total_sales)<br> FROM orders ...</div>`:type==='chat'?`<div class="chat-bubble">How does retrieval work?</div><div class="chat-bubble reply">Search context → grounded answer</div>`:type==='audio'?`<div class="audio-bars">${Array.from({length:16},(_,i)=>`<b style="opacity:${.45+i%5*.12}"></b>`).join('')}</div>`:`<div class="sql-code">const assistant =<br> await model.generate({<br> &nbsp;context, code<br> });</div>`;return `<div class="proj-window"><div class="proj-head"><span>nextmind / ${project.id}</span>${icon(type==='audio'?'mic':'spark',12)}</div>${body}</div>`}
function projectCard(p){return `<article class="project-card glass"><div class="project-display"><span class="display-label">${p.id.toUpperCase()} / VISUAL CONCEPT</span>${projectWindow(p)}</div><div class="project-body"><span class="smallcap">${p.cat}</span><h3>${p.name}</h3><p>${p.short}</p><a href="#project/${p.id}">Read case study ${icon('diag',13)}</a></div></article>`}
function academyVisual(){return `<div class="academy-preview glass"><div class="fake-window"><div class="fake-window-head"><strong>NextMind / Learning space</strong><div class="tiny-dots"><i></i><i></i><i></i></div></div><div class="fake-window-body"><div class="lesson-card"><div class="lesson-top">${icon('cpu',34)}</div><strong>Learn by building</strong><small>Illustrative course layout</small><div class="lesson-bottom"><i></i>${icon('play',12)}</div></div><div class="lesson-card"><div class="lesson-top">${icon('code',34)}</div><strong>Practice with projects</strong><small>Illustrative learning track</small><div class="lesson-bottom"><i></i>${icon('play',12)}</div></div></div></div><div class="academy-overlay"><div><strong>Academy experience</strong><p>Preview of the proposed learning interface</p></div><span class="tag">CONCEPT ONLY</span></div></div>`}
function process(){return `<div class="process-grid">${[['01','Discover','Understand the problem, users and data.'],['02','Architect','Design the model, workflow and success criteria.'],['03','Build','Develop, validate and refine with real inputs.'],['04','Deploy','Integrate, operate and improve the system.']].map(v=>`<div class="process-step"><span class="step-num">${v[0]} / 04</span><h3>${v[1]}</h3><p>${v[2]}</p></div>`).join('')}</div>`}
function cta(){return `<section class="section" style="padding-bottom:0"><div class="container"><div class="glass cta-banner"><span class="eyebrow" style="justify-content:center">LET'S BUILD WHAT'S NEXT</span><h2>Ideas are everywhere.<br>Execution makes the difference.</h2><p>Tell us what you're building. We'll explore how AI can make it real.</p>${linkBtn('Start a conversation','contact')}</div></div></section>`}
function home(){return `<main class="page"><div class="container"><section class="hero"><div class="hero-copy"><div class="eyebrow">AN ENGINEERING-FIRST AI COMPANY <span class="hero-tag">DESIGN / BUILD / DEPLOY</span></div><h1>Ideas into<br><em>intelligence.</em><br>Intelligence into<br>impact<span class="period">.</span></h1><p>We design, build and integrate intelligent systems — and make the skills behind them accessible. Real AI engineering, built for the world beyond the demo.</p><div class="hero-actions">${linkBtn('Explore AI Solutions','solutions')}${linkBtn('Discover Academy','academy','secondary')}</div><div class="hero-foot"><i class="pulse"></i><span>ENGINEERING</span><span>·</span><span>INTELLIGENT PRODUCTS</span><span>·</span><span>ACADEMY</span></div></div>${visualHero()}</section><div class="brandbar"><span class="smallcap">OUR ENGINEERING DISCIPLINES</span><div class="brandbar-list"><span>Generative AI</span><span>AI Agents</span><span>RAG Systems</span><span>Computer Vision</span><span>Automation</span></div></div></div><section class="section"><div class="container">${intro('WHAT WE DO','Technology that works.<br>Not just technology that talks.','We design around real business problems, not a fixed AI template.')}<div class="service-grid">${[['01','AI Engineering','build','Custom AI products and scalable intelligent systems.'],['02','Intelligent Automation','automate','Multi-step workflows and task-oriented AI agents.'],['03','Knowledge & RAG','rag','Context-aware answers powered by your own knowledge.'],['04','Vision & Documents','vision','Understand images, scanned documents and video.']].map(x=>`<a class="service-card glass" href="#solutions"><span class="card-index">${x[0]} / SOLUTION</span>${serviceArt(x[2])}<h3>${x[1]}</h3><p>${x[3]}</p><span class="go">Explore capability ${icon('diag',14)}</span></a>`).join('')}</div></div></section><section class="section" style="padding-top:15px"><div class="container showcase"><div class="showcase-left"><span class="eyebrow">NEXTMIND ACADEMY</span><h2>Not just another course platform.</h2><p>Our vision for the Academy is hands-on education in AI, programming and software engineering — centered on building, testing and real applications.</p><p style="font-size:11px;color:var(--accent);font-weight:800;margin:8px 0">COURSES ARE NOT PUBLISHED YET</p>${linkBtn('Explore the Academy','academy')}</div>${academyVisual()}</div></section><section class="section" style="padding-top:35px"><div class="container">${intro('SELECTED WORK','Evidence of engineering.','A selection of published NextMind.ai project case studies.',`<a href="#projects" class="btn btn-secondary">All projects ${icon('diag',14)}</a>`)}<div class="projects-grid">${projects.slice(0,3).map(projectCard).join('')}</div></div></section><section class="section" style="padding-bottom:30px"><div class="container"><div class="stats-band">${[['270+','Students learning'],['15+','Clients & organizations'],['20+','Projects delivered'],['4+','Years of experience']].map(v=>`<div class="stat"><strong>${v[0]}</strong><span>${v[1]}</span></div>`).join('')}</div><p style="font-size:10px;text-align:center;margin:14px 0 0">Figures displayed on the existing NextMind.ai homepage; not independently audited.</p></div></section><section class="section"><div class="container">${intro('OUR APPROACH','From problem to product.','A practical path from understanding your challenge to integrating a working system.')}${process()}</div></section>${cta()}</main>`}
function pageHero(eyebrow,title,sub){return `<section class="page-hero"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></section>`}
function solutionsPage(){return `<main class="page"><div class="container">${pageHero('AI SOLUTIONS','Intelligent systems.<br>Real-world impact.','We design and implement AI solutions for organizations — from focused automations to full custom AI products.')}<section class="page-section" style="padding-top:0"><div class="pills" id="solutionFilters">${['All','Build','Automate','Knowledge & Data','Vision & Integration'].map((f,i)=>`<button class="pill ${!i?'active':''}" data-sol-filter="${f}">${f}</button>`).join('')}</div><div class="solution-grid" id="solutionGrid">${solutionCards('All')}</div></section><section class="section" style="padding-top:35px">${intro('THE PROCESS','Built around your business.','Discover, design, build and deploy with clear milestones.')}${process()}</section><section class="section" style="padding-top:0">${intro('FREQUENT QUESTIONS','Before we start.') }<div class="faq">${FAQs.map(([q,a])=>`<div class="faq-item"><button class="faq-toggle" aria-expanded="false">${q}${icon('chev',18)}</button><div class="answer"><p>${a}</p></div></div>`).join('')}</div></section></div>${cta()}</main>`}
function solutionCards(filter){return solutions.filter(s=>filter==='All'||s[0]===filter).map(s=>`<article class="solution-card glass"><div class="icon-wrap">${icon(s[3],24)}</div><h3>${s[1]}</h3><p>${s[2]}</p><div class="card-bottom"><span>${s[0]}</span><a href="#contact">Discuss ${icon('diag',12)}</a></div></article>`).join('')}
function academyPage(){return `<main class="page"><div class="container">${pageHero('NEXTMIND ACADEMY','Learn it. Build it.<br>Understand it.','A future home for practical AI and programming education, designed around doing rather than just watching.')}<section class="page-section" style="padding-top:0"><div class="academy-large glass"><span class="coming-badge">ACADEMY · COMING SOON</span><h2>Build the skills to build what's next.</h2><p>The current live website has no published courses yet. This preview shows a proposed Academy direction — not a live course catalog or enrollment system.</p><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:15px">${linkBtn('Talk to NextMind','contact')}${`<a class="btn btn-secondary" href="https://nextmindai.net/courses" target="_blank" rel="noopener">Current Academy ${icon('external',13)}</a>`}</div></div></section><section class="section" style="padding-top:10px">${intro('LEARNING PHILOSOPHY','Built for real understanding.','The design direction for learning experiences; these are proposed principles, not course promises.')}<div class="outcome-grid"><div class="glass outcome-card">${icon('code',29)}<h3>Project-led practice</h3><p>Work through realistic problems with clear learning outcomes.</p></div><div class="glass outcome-card">${icon('target',29)}<h3>Skills that transfer</h3><p>Practice approaches you can apply beyond an individual lesson.</p></div><div class="glass outcome-card">${icon('grad',29)}<h3>Modern AI thinking</h3><p>Understand how AI models connect to products and systems.</p></div></div></section><section class="section" style="padding-top:12px">${intro('CONCEPT PREVIEW','A learning experience designed to build.','A visual exploration of how the Academy interface could feel.')}<div style="max-width:740px;margin:auto">${academyVisual()}</div></section></div>${cta()}</main>`}
function projectsPage(){return `<main class="page"><div class="container">${pageHero('ENGINEERING PORTFOLIO','Designed for problems.<br>Built for the real world.','Explore the published case studies across computer vision, enterprise data, RAG, voice AI and developer tools.')}<section class="page-section" style="padding-top:0"><div class="pills" id="projectFilters">${[['all','All projects'],['vision','Vision'],['enterprise','Enterprise AI'],['assistant','Assistants & tools']].map(([k,v],i)=>`<button class="pill ${!i?'active':''}" data-project-filter="${k}">${v}</button>`).join('')}</div><div class="projects-grid" id="projectGrid">${projects.map(projectCard).join('')}</div></section></div>${cta()}</main>`}
function detailPage(id){const p=projects.find(x=>x.id===id);if(!p)return projectsPage();return `<main class="page"><div class="container project-detail"><a href="#projects" class="btn btn-plain btn-small">← Back to projects</a><div class="detail-head"><div><span class="eyebrow">${p.cat}</span><h2>${p.name}</h2></div></div><div class="project-display glass" style="height:310px;border-radius:20px;margin:25px 0">${projectWindow(p)}</div><div class="glass info-block"><h3>The challenge</h3><p>${p.problem}</p></div><div class="glass info-block"><h3>The approach</h3><p>${p.solution}</p></div><div class="glass info-block"><h3>Technologies referenced on the live website</h3><div class="tech-pills">${p.tech.map(t=>`<span>${t}</span>`).join('')}</div></div><p style="font-size:11px;margin-top:20px">Visual interface is a conceptual illustration, not a screenshot of the deployed project. No performance or ROI figures are implied.</p><div style="margin-top:30px">${linkBtn('Discuss a similar project','contact')}</div></div></main>`}
function aboutPage(){return `<main class="page"><div class="container">${pageHero('ABOUT NEXTMIND','We turn ideas into<br>working intelligence.','Engineering useful AI systems and making modern technology more accessible through practical education.')}<section class="page-section" style="padding-top:0"><div class="about-profile glass"><div class="avatar-frame"><div class="about-identity-mark">${circuitMark()}</div><span style="position:absolute;bottom:20px;font-size:9px;letter-spacing:.15em;color:var(--muted)">NEXTMIND / INTELLIGENCE ENGINEERED</span></div><div><span class="eyebrow">ENGINEERING-LED FOUNDATION</span><h2 style="font-size:clamp(29px,3vw,45px);margin:20px 0">A company identity, backed by real engineering.</h2><p>NextMind.ai brings AI engineering, product thinking and applied education together. Its published site highlights real experience spanning Generative AI, LLMs, AI Agents, RAG, Computer Vision and software integrations.</p><p>The current website identifies Eng. Mohammad Talal Omran as its AI Engineer and instructor. This proposed About page puts the company first while retaining the founding engineer's credibility.</p><a href="https://nextmindai.net/about" target="_blank" rel="noopener" class="btn btn-secondary">View existing profile ${icon('external',14)}</a></div></div><div class="about-lower"><div class="glass"><span class="eyebrow">THE COMPANY</span><h3 style="margin:20px 0 9px">Build with purpose.</h3><p style="font-size:12px">Our proposed brand positioning: applied AI that fits actual workflows, systems and teams — not technology for technology's sake.</p></div><div class="glass"><span class="eyebrow">OUR DISCIPLINES</span><h3 style="margin:20px 0 9px">A connected skill set.</h3><ul><li>AI systems, custom products and automation</li><li>Retrieval, reasoning and enterprise data</li><li>Computer Vision and document intelligence</li><li>Hands-on AI and programming education</li></ul></div></div></section></div>${cta()}</main>`}
function contactPage(){return `<main class="page"><div class="container">${pageHero('LET’S CONNECT','Your next idea<br>starts here.','Tell us what you are trying to solve, improve or learn. The live NextMind website provides its official contact destinations.')}<section class="page-section" style="padding-top:0"><div class="contact-layout"><div class="contact-aside glass"><h3>Start with a conversation.</h3><p>Whether you're building a company AI product, exploring automation or asking about education, the first step is simple: describe your idea.</p><a href="https://nextmindai.net/contact" target="_blank" rel="noopener" class="contact-option"><strong>Official contact page ↗</strong><span>Go to the existing company website</span></a><a href="https://nextmindai.net/services" target="_blank" rel="noopener" class="contact-option"><strong>Explore services ↗</strong><span>Review the live AI Solutions portfolio</span></a><a href="https://nextmindai.net/projects" target="_blank" rel="noopener" class="contact-option"><strong>See the project portfolio ↗</strong><span>Browse the published case studies</span></a></div><form class="contact-form glass" id="contactDemoForm"><span class="eyebrow" style="margin-bottom:23px">FORM CONCEPT</span><h3>Tell us about your project.</h3><p class="form-note">This is an interactive UI preview. The form is not connected to email, CRM or a backend. Submission will not send your information.</p><div class="form-row"><div class="field"><label for="cName">Your name</label><input id="cName" name="name" placeholder="Your name" required></div><div class="field"><label for="cEmail">Email address</label><input id="cEmail" name="email" type="email" placeholder="you@company.com" required></div></div><div class="field"><label for="cTopic">What can we help with?</label><select id="cTopic" name="topic"><option>Custom AI development</option><option>AI automation / agents</option><option>Knowledge / RAG system</option><option>AI Academy</option><option>Other inquiry</option></select></div><div class="field"><label for="cMessage">Tell us more</label><textarea id="cMessage" name="message" required placeholder="A little context about what you're planning..."></textarea></div><button type="submit" class="btn btn-primary">Preview submission ${icon('arrow',14)}</button></form></div></section></div></main>`}
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),5200)}
function currentPage(){return (location.hash.replace(/^#/,'')||'home').split('/')[0]}
function render(){if(typeof stopExperience==='function')stopExperience();let path=location.hash.replace(/^#/,'')||'home';let [page,detail]=path.split('/');document.title=`${({home:'Home',solutions:'AI Solutions',academy:'Academy',projects:'Projects',about:'About',contact:'Contact',project:'Project'}[page]||'Home')} — NextMind.ai | Circuit N Experience`;const pages={home,solutions:solutionsPage,academy:academyPage,projects:projectsPage,about:aboutPage,contact:contactPage};let content=page==='project'?detailPage(detail):(pages[page]||home)();document.getElementById('app').innerHTML=`<div class="ambient"><div class="third"></div><div class="grid-noise"></div></div>${header(page)}${content}${footer()}`;document.getElementById('themeSwitch').addEventListener('click',toggleTheme);document.getElementById('mobileMenu').addEventListener('click',()=>{let el=document.getElementById('siteLinks');let open=el.classList.toggle('open');document.getElementById('mobileMenu').setAttribute('aria-expanded',open);document.getElementById('mobileMenu').innerHTML=icon(open?'close':'menu',21)});document.querySelectorAll('[data-sol-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-sol-filter]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('solutionGrid').innerHTML=solutionCards(b.dataset.solFilter)}));document.querySelectorAll('[data-project-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-project-filter]').forEach(x=>x.classList.toggle('active',x===b));let f=b.dataset.projectFilter;let ps=f==='all'?projects:f==='vision'?projects.filter(p=>p.id==='qavia'):f==='enterprise'?projects.filter(p=>p.id==='yuma'):projects.filter(p=>['itlegend','justtalk','abcode'].includes(p.id));document.getElementById('projectGrid').innerHTML=ps.map(projectCard).join('')}));document.querySelectorAll('.faq-toggle').forEach(b=>b.addEventListener('click',()=>{let item=b.closest('.faq-item');let open=item.classList.toggle('open');b.setAttribute('aria-expanded',open)}));document.getElementById('contactDemoForm')?.addEventListener('submit',e=>{e.preventDefault();toast('Preview only — no information was submitted. Use the official contact page to reach NextMind.ai.')});updateHeader();window.scrollTo({top:0,behavior:'instant'});if(typeof initExperience==='function')initExperience();}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('nextmind-preview-theme',t)}catch{};document.getElementById('themeSwitch').innerHTML=icon(t==='dark'?'sun':'moon',18);document.querySelector('meta[name="theme-color"]').setAttribute('content',t==='dark'?'#061226':'#EAF3FF')}
function updateHeader(){document.getElementById('siteHeader')?.classList.toggle('scrolled',scrollY>20)}
window.addEventListener('hashchange',render);window.addEventListener('scroll',updateHeader,{passive:true});try{const t=localStorage.getItem('nextmind-preview-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch{};render();

</script>
</body>
</html>
